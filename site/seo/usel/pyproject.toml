[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "usel-global"
version = "0.2.0"
description = "evidence-aware international SEO compiler and worldwide registry"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "fastapi>=0.110,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
usel = "usel.cli:main"

[tool.setuptools]
packages = ["usel"]
