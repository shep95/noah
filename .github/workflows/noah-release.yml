# noah release pipeline (unsigned).
#
# Builds downloadable installers for macOS and Linux on GitHub-hosted runners
# and attaches them to a GitHub Release. The Windows installer is built with
# script/build-windows-cross. Uses only the built-in `gh` CLI
# and GitHub-authored actions (actions/checkout, actions/setup-node) so it works
# even under the strictest repo Actions policy (no third-party actions required).
#
# Unsigned: users see OS security warnings until signing certs are added.
#
# Trigger: push a tag like `v0.1.0`, or run manually from the Actions tab.

name: noah release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Both builds run on an Apple Silicon runner; the Intel one is
        # cross-compiled, since GitHub retired its Intel macOS runners.
        arch: [aarch64, x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Install Rust target
        run: rustup target add ${{ matrix.arch }}-apple-darwin
      - name: Bundle (ad-hoc signed)
        run: script/bundle-mac ${{ matrix.arch }}-apple-darwin
      - name: Collect + publish
        run: |
          mkdir -p dist
          cp target/${{ matrix.arch }}-apple-darwin/release/noah-*.dmg \
             "dist/noah-macos-${{ matrix.arch }}.dmg"
          gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" dist/noah-macos-${{ matrix.arch }}.dmg --clobber

  linux:
    name: Linux (x86_64)
    # The oldest supported Ubuntu keeps the glibc requirement low, so the
    # packages run on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Select stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Install system dependencies
        run: ./script/linux
      - name: Package
        run: script/build-linux-package
      - name: Publish
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" dist/noah-linux-x86_64.tar.xz dist/noah-linux-amd64.deb --clobber
