name: noah mac build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: noah-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: macos-14
    timeout-minutes: 240
    env:
      ZED_RELEASE_CHANNEL: stable
      RELEASE_CHANNEL: stable
      ZED_BUNDLE: "true"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build number
        run: echo "NOAH_BUILD=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: noah-mac-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: noah-mac-
      - name: Bundle (unsigned)
        run: script/bundle-mac
      - name: Collect the disk image
        run: |
          mkdir -p dist
          find target -name '*.dmg' -newer Cargo.lock -exec cp {} dist/noah-mac-aarch64.dmg \;
          ls -la dist
          test -f dist/noah-mac-aarch64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: noah-mac-aarch64
          path: dist/noah-mac-aarch64.dmg
          retention-days: 14
